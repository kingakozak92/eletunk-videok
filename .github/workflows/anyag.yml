name: edu-zene
on:
  push:
    branches: [anyag-letoltes]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Letoltes
        run: |
          mkdir -p anyag/edu && cd anyag/edu
          for id in bgm-pop-20-notebook bgm-pop-12-step-by-step bgm-how-it-works bgm-pop-35-open-office bgm-pop-41-quiet-announcement; do
            curl -sfL -A "Mozilla/5.0" -o $id.mp3 "https://arcalune.com/api/tracks/$id/download" || echo "hiba $id"
          done
          ls -la; file *
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add anyag; git commit -m "Edu zene" || true
          git push origin anyag-letoltes
